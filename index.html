<!DOCTYPE html>
<html lang="en-US"><head>

<meta charset="UTF-8" />
<title>Liar&rsquo;s card</title>

<link href="/frac16.png" rel="icon" sizes="16x16" type="image/png" />
<link href="/frac32.png" rel="icon" sizes="32x32" type="image/png" />
<link href="/frac64.png" rel="icon" sizes="64x64" type="image/png" />

<link href="style.css" rel="stylesheet" />

</head><body>

<h1>Liar&rsquo;s card</h1>
<div class="gameboard">
   <div id="score-section">
      <div>Your score:</div>
      <div id="score"></div>
   </div>
   <div id="player-hand">
      <div>Your card:</div>
      <div class="cards">
         <div class="card card-value-1">1</div>
         <div class="card card-value-2">2</div>
         <div class="card card-value-3">3</div>
         <div class="card card-value-4">4</div>
      </div>
   </div>
   <div id="player-claim">
      <div id="claim-instructions"></div>
      <div class="cards">
         <div class="card card-value-1">1</div>
         <div class="card card-value-2">2</div>
         <div class="card card-value-3">3</div>
         <div class="card card-value-4">4</div>
      </div>
   </div>
   <div id="opponent-claim">
      <div>Your opponent has claimed:</div>
      <div class="cards">
         <div class="card card-value-1">1</div>
         <div class="card card-value-2">2</div>
         <div class="card card-value-3">3</div>
         <div class="card card-value-4">4</div>
      </div>
   </div>
   <div id="opponent-hand">
      <div>Your opponent&rsquo;s card:</div>
      <div class="cards">
         <div class="card card-value-1">1</div>
         <div class="card card-value-2">2</div>
         <div class="card card-value-3">3</div>
         <div class="card card-value-4">4</div>
      </div>
   </div>
   <div id="result-section">
      <div id="result">&nbsp;</div>
      <div id="start-next-hand">Next hand</div>
   </div>
</div>
<canvas id="score-history"></canvas>

<script src="script.js"></script>

</body></html>
